# Headless CI for wasmlogin — the pure-Go (CGO=0) login portal + WM
# selector + reverse proxy in front of the wasmbox / wasmaqua desktops.
#
# Three jobs:
#   build-and-test — gofmt gate, go vet, go build, and `go test -race` with
#                    the 100% statement-coverage floor the service holds.
#   cross-build    — prove the pure-Go binary cross-compiles for every
#                    server/desktop target in the wasmdesk arch matrix.
#   e2e            — build wasmlogin + the desktop stubs, then drive the real
#                    login → WM-dispatch → logout flow through a headless
#                    Chromium with Playwright (test/e2e/flow.js), proving the
#                    portal signs a user in, reverse-proxies them into the
#                    chosen desktop, and bounces unauthenticated requests.
#
# There is no wasm client in this repo (it is a server binary), so there is
# no wasm build step. CGO is off everywhere (pure Go); GOWORK=off keeps the
# module self-contained.
name: CI

on:
  push:
    branches: [main, ci-headless]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  build-and-test:
    name: Build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race + coverage)
        # The race detector needs cgo; the runner ships gcc. The production
        # binary stays pure Go (CGO=0) — this only instruments the tests.
        env:
          CGO_ENABLED: "1"
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true

      - name: Build cmd/serve
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/serve

  e2e:
    name: Headless login flow (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build wasmlogin + desktop stubs
        run: |
          mkdir -p bin
          go build -trimpath -o bin/wasmlogin ./cmd/serve
          go build -trimpath -o bin/stubs ./test/e2e/stubs.go

      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start desktop stubs + portal
        run: |
          ./bin/stubs 127.0.0.1:7081 "OK wasmbox"  > stub-box.log  2>&1 &
          echo "$!" > stub-box.pid
          ./bin/stubs 127.0.0.1:7082 "OK wasmaqua" > stub-aqua.log 2>&1 &
          echo "$!" > stub-aqua.pid
          SESSION_KEY=ci-fixed-session-key ./bin/wasmlogin \
            -addr=127.0.0.1:9001 \
            -wasmbox-url=http://127.0.0.1:7081 \
            -wasmaqua-url=http://127.0.0.1:7082 > portal.log 2>&1 &
          echo "$!" > portal.pid
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null "http://127.0.0.1:9001/healthz"; then
              echo "portal is up"; break
            fi
            sleep 0.2
          done

      - name: Run headless login/dispatch/logout e2e
        working-directory: test/e2e
        env:
          PORTAL_URL: "http://127.0.0.1:9001"
        run: node flow.js

      - name: Stop servers
        if: always()
        run: |
          for p in portal.pid stub-box.pid stub-aqua.pid; do
            [ -f "$p" ] && kill "$(cat "$p")" 2>/dev/null || true
          done
          echo "---- portal.log ----";   cat portal.log   || true
          echo "---- stub-box.log ----"; cat stub-box.log || true
