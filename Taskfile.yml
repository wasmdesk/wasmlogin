# Taskfile for wasmlogin — https://taskfile.dev
#
#   task            # list tasks
#   task build      # build bin/wasmlogin
#   task serve      # build, then run on :9000
#   task test       # run go test with coverage
#   task clean      # remove build artifacts
#
# wasmlogin is a pure-Go (CGO=0) login portal that gates access to the
# wasmdesk family of in-browser desktops. The login page + CSS are
# embedded with //go:embed; no external assets are needed at runtime.
version: "3"

vars:
  ADDR: '{{default ":9000" .ADDR}}'
  WASMBOX_URL: '{{default "http://localhost:8080" .WASMBOX_URL}}'
  WASMAQUA_URL: '{{default "http://localhost:8081" .WASMAQUA_URL}}'
  SESSION_TTL: '{{default "12h" .SESSION_TTL}}'

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

tasks:
  default:
    cmds:
      - task -l

  build:
    desc: Build bin/wasmlogin
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/wasmlogin ./cmd/serve

  serve:
    desc: Build + run wasmlogin on $ADDR
    deps: [build]
    cmds:
      - ./bin/wasmlogin -addr={{.ADDR}} -wasmbox-url={{.WASMBOX_URL}} -wasmaqua-url={{.WASMAQUA_URL}} -session-ttl={{.SESSION_TTL}}

  test:
    desc: go test with coverage (100% floor)
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin coverage.out
